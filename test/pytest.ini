[tool:pytest]
minversion = 6.0
addopts = -ra -q --strict-markers --strict-config
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[pytest.markers]
slow = marks tests as slow (deselect with '-m "not slow"')
integration = marks tests as integration tests
unit = marks tests as unit tests
ui = marks tests as UI tests
workflow = marks tests as workflow tests
memory = marks tests as memory tests
safety = marks tests as safety tests
llm = marks tests as LLM tests
skills = marks tests as skills tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:langchain.*
    ignore::UserWarning:streamlit.*

# Test discovery
collect_ignore_glob =
    setup.py
    conftest.py

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if pytest-cov is installed)
addopts = --cov=core --cov=services --cov=models --cov=utils --cov-report=term-missing --cov-report=html --cov-report=xml
