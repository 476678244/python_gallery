name: safe_claw
channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python>=3.11,<3.13

  # 构建工具
  - pip

  # 核心依赖（conda 提供）
  - pydantic>=2.7.4,<3.0.0
  - python-dotenv>=1.0.1

  # 可选：向量检索
  - sentence-transformers>=3.0.1,<4.0.0

  # pip 安装（无法通过 conda 获得或版本要求）
  - pip:
    # ================================
    # LangGraph + LangChain 核心
    # ================================
    - langgraph>=1.1.1,<2.0.0
    - langchain>=0.2.16,<0.3.0
    - langchain-core>=0.2.38,<0.3.0
    - langchain-community>=0.2.16,<0.3.0
    - langchain-openai>=0.1.23,<0.2.0
    - langchain-anthropic>=0.1.23,<0.2.0

    # ================================
    # LLM 网关
    # ================================
    - litellm>=1.51.0,<2.0.0
    - openai>=1.40.0,<2.0.0
    - anthropic>=0.34.2,<1.0.0

    # ================================
    # UI
    # ================================
    - streamlit>=1.33.0,<2.0.0
    - streamlit-graphviz>=0.0.6
    - graphviz>=0.20.3

    # ================================
    # 配置 & 数据模型
    # ================================
    - pydantic-settings>=2.2.1,<3.0.0

    # ================================
    # RAG / 向量（可选）
    # ================================
    - chromadb>=0.5.5,<0.6.0

    # ================================
    # 文件处理（可选）
    # ================================
    - pypdf>=4.3.1
    - markdown>=3.6

    # ================================
    # 执行沙箱
    # ================================
    - docker>=7.1.0; sys_platform != "win32"

    # ================================
    # 安全存储
    # ================================
    - keyring>=25.2.1

    # ================================
    # 开发依赖
    # ================================
    - pytest>=8.3.2
    - pytest-asyncio>=0.23.7
    - black>=24.8.0
    - ruff>=0.6.2
    - mypy>=1.11.1

# 环境变量（可选）
variables:
  # 设置 SafeClaw 数据目录
  SAFE_CLAW_HOME: ~/.safe_claw
  # Streamlit 配置
  STREAMLIT_SERVER_PORT: "8501"

# 前缀（安装位置，可选）
# prefix: /path/to/custom/env
