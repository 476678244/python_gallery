[tool:pytest]
minversion = 6.0
testpaths = test/api
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
norecursedirs = test/unit test/integration test/e2e test/deepagents test/unittest node_modules

[pytest]
minversion = 6.0
testpaths = test/api
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
norecursedirs = test/unit test/integration test/e2e test/deepagents test/unittest node_modules

markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
